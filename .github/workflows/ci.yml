name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    # The offline operator requires a native loopback endpoint, not Docker NAT.
    runs-on: ubuntu-24.04

    env:
      CI: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 16 server and client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          printf '/usr/lib/postgresql/16/bin\n' >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: Start owned native loopback PostgreSQL 16
        run: |
          owned="$RUNNER_TEMP/sies-pg16"
          mkdir -m 700 "$owned"
          mkdir -m 700 "$owned/socket"
          password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$password"
          (umask 077; printf '%s\n' "$password" > "$owned/password")
          initdb -D "$owned/data" -U baseline -A scram-sha-256 --pwfile="$owned/password" --no-locale -E UTF8
          printf 'OWNED_PG16_DATA=%s\n' "$owned/data" >> "$GITHUB_ENV"
          pg_ctl -D "$owned/data" -l "$owned/server.log" -o "-h 127.0.0.1 -p 55432 -k $owned/socket" -w start
          printf 'DATABASE_URL=postgresql://baseline:%s@127.0.0.1:55432/the_sies_files_test\n' "$password" >> "$GITHUB_ENV"
          printf 'E2E_DATABASE_URL=postgresql://baseline:%s@127.0.0.1:55432/the_sies_files_test\n' "$password" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Canonical isolated regression baseline
        run: npm run baseline -- run baseline-results/ci-production production

      - name: Upload baseline evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-baseline
          path: |
            baseline-results/ci-production/run.json
            baseline-results/ci-production/stages.json
            baseline-results/ci-production/*.log
            baseline-results/ci-production/*discovery.json
            baseline-results/ci-production/unit.json
            baseline-results/ci-production/browser.json
            baseline-results/ci-production/security-summary.json
            baseline-results/ci-production/lifecycle/summary.json
            baseline-results/ci-production/provenance/report.json
            baseline-results/ci-production/provenance/notices.json
            baseline-results/ci-production/compatibility/compatibility.json
            baseline-results/ci-production/compatibility/*-rows.json
            baseline-results/ci-production/compatibility/*.log
            baseline-results/ci-production/compatibility-A/manifest.json
            baseline-results/ci-production/recovery/recovery.json
            baseline-results/ci-production/recovery/recovery-native.json
            baseline-results/ci-production/recovery/recovery-discovery.json
            baseline-results/ci-production/browser-artifacts/
            baseline-results/ci-production/html/
          retention-days: 14

      - name: Stop only the owned PostgreSQL cluster
        if: always()
        run: |
          if [ -n "${OWNED_PG16_DATA:-}" ] && [ -f "$OWNED_PG16_DATA/postmaster.pid" ]; then
            pg_ctl -D "$OWNED_PG16_DATA" -m fast -w stop
          fi
