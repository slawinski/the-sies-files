name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_sies_files_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_sies_files_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_sies_files_test
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client tools (E2E reset)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Canonical isolated regression baseline
        run: npm run baseline -- run baseline-results/ci-production production

      - name: Upload baseline evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-baseline
          path: |
            baseline-results/ci-production/run.json
            baseline-results/ci-production/stages.json
            baseline-results/ci-production/*.log
            baseline-results/ci-production/*discovery.json
            baseline-results/ci-production/unit.json
            baseline-results/ci-production/browser.json
            baseline-results/ci-production/browser-artifacts/
            baseline-results/ci-production/html/
          retention-days: 14
