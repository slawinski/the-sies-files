name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_sies_files_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_sies_files_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/the_sies_files_test
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (empty test DB)
        run: npx prisma migrate deploy

      - name: Unit + integration tests
        run: npm test

      - name: Install PostgreSQL client tools (E2E reset)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (full-game scenarios)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
